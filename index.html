<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14395d"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>Flowmeter Calibration App</title>
<style>
:root{font-family:Arial,sans-serif;color:#172433;background:#e9eef2}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}header{position:sticky;top:0;z-index:5;background:#14395d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 12px}h1{font-size:21px;margin:0}.icon{border:0;background:transparent;color:white;font-size:30px;padding:0 10px}main{padding:14px}.hidden{display:none!important}.meter{background:#e8eef3;border-radius:12px;padding:7px;text-align:center;margin-bottom:12px}.meter svg{height:110px;max-width:100%}.status{font-weight:800;letter-spacing:1px}.green{color:#16843a}.red,.error{color:#c71f25}.grid{display:grid;grid-template-columns:1fr;gap:10px}label{font-weight:700;display:block}input,textarea,select{width:100%;font:inherit;padding:12px;border:1px solid #9aa8b3;border-radius:7px;margin-top:5px;background:#fff}small{font-weight:400;color:#52606c}.error{display:block;font-size:12px;margin-top:3px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}button{min-height:46px;border:0;border-radius:7px;background:#14395d;color:#fff;font-weight:800;padding:10px}button:disabled{opacity:.4}.secondary{background:#596a78}.danger{background:#ae2025}.result{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#edf7ef;padding:12px;border-radius:8px;margin-top:12px}.certificate{background:#fff;border:1px solid #333;padding:15px}.certificate h2,.certificate h3{text-align:center}.certrow{display:grid;grid-template-columns:55% 45%;padding:6px 0;border-bottom:1px solid #ddd}.signature{width:100%;height:130px;border:2px dashed #61717e;touch-action:none;background:white}.historyCard{display:grid;gap:6px;border:1px solid #ccd4da;border-radius:8px;padding:12px;margin:10px 0}.historyCard .buttons,.listrow{display:flex;gap:8px}.listrow{margin:6px 0}.listrow input{margin:0}.listrow button{min-width:60px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#152635;color:#fff;padding:12px 18px;border-radius:8px;z-index:20;max-width:90%}@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:repeat(3,1fr)}}
@media print{body{background:white}.app{max-width:none}.noPrint,header{display:none!important}main{padding:0}.screen{display:none!important}#certificateScreen{display:block!important}.certificate{border:1px solid #000;min-height:277mm;padding:12mm}.signature{border:0;height:30mm}}
</style></head><body><div class="app">
<header><button class="icon" id="backBtn" aria-label="Back">‹</button><h1 id="title">Flowmeter Calibration</h1><button class="icon" id="closeBtn" aria-label="Close">×</button></header>
<main>
<section id="mainScreen" class="screen">
<div class="meter"><svg viewBox="0 0 360 150" aria-label="Industrial flowmeter"><rect x="10" y="60" width="80" height="35" rx="4" fill="#8896a3"/><rect x="270" y="60" width="80" height="35" rx="4" fill="#8896a3"/><circle cx="180" cy="77" r="65" fill="#d8dee4" stroke="#263746" stroke-width="7"/><rect id="meterDisplay" x="125" y="42" width="110" height="70" rx="9" fill="white" stroke="#263746" stroke-width="5"/></svg><div id="meterStatus" class="status">READY</div></div>
<div class="grid">
<label>Calibration Date<input id="date" type="date"><span class="error" data-e="date"></span></label>
<label>Flowmeter Serial Number<input id="serial" list="serialList" autocomplete="off"><datalist id="serialList"></datalist><span class="error" data-e="serial"></span></label>
<label>Product Used for Calibration<input id="product" list="productList" autocomplete="off"><datalist id="productList"></datalist><span class="error" data-e="product"></span></label>
<label>Other Product<input id="otherProduct" type="text"><small>Overrides the listed product when entered.</small></label>
<label>Tare Weight <small>(kg)</small><input id="tare" type="number" inputmode="decimal" step="any"><span class="error" data-e="tare"></span></label>
<label>Gross Weight <small>(kg)</small><input id="gross" type="number" inputmode="decimal" step="any"><span class="error" data-e="gross"></span></label>
<label>Liters Pumped <small>(litres)</small><input id="litersPumped" type="number" inputmode="decimal" step="any"><span class="error" data-e="litersPumped"></span></label>
<label>Oil Density <small>(kg/L)</small><input id="density" type="number" inputmode="decimal" step="any"><span class="error" data-e="density"></span></label>
<label>Responsible Person<input id="responsible" type="text"><span class="error" data-e="responsible"></span></label></div>
<div id="resultPanel" class="result hidden"></div>
<div class="actions"><button id="calibrateBtn">CALIBRATE</button><button id="certificateBtn" disabled>CERTIFICATE</button><button id="resetBtn" class="secondary">RESET</button><button data-go="history" class="secondary">HISTORY</button><button data-go="settings" class="secondary">SETTINGS</button><button id="installAppBtn" class="secondary">INSTALL APP</button></div></section>
<section id="certificateScreen" class="screen hidden"><div id="certificate" class="certificate"></div><div class="actions noPrint"><button id="printBtn">PRINT</button><button data-go="main" class="secondary">BACK</button></div></section>
<section id="historyScreen" class="screen hidden"><input id="historySearch" placeholder="Search serial, product or result"><div class="grid"><label>Date filter<input id="historyDate" type="date"></label><label>Result filter<select id="historyResult"><option value="">All</option><option>IN SPEC</option><option>OUT OF SPEC</option></select></label></div><div class="actions"><button id="exportCsv">EXPORT CSV</button></div><div id="historyList"></div></section>
<section id="settingsScreen" class="screen hidden"><label>Company Name<input id="companyName"></label><label>Company Address<textarea id="companyAddress"></textarea></label><label>Company Logo<input id="companyLogo" type="file" accept="image/*"></label><label>Work Instruction<input id="workInstruction"></label><label>Calibration Frequency<input id="frequency"></label><label>Acceptable Limit<input id="acceptableLimit"></label><label>Default Responsible Person<input id="defaultResponsible"></label><label>Number of Decimal Places<input id="decimals" type="number" min="0" max="4"></label><h3>Flowmeter Serial Numbers</h3><div id="serialEditor"></div><button id="addSerial">ADD SERIAL NUMBER</button><h3>Products</h3><div id="productEditor"></div><button id="addProduct">ADD PRODUCT</button><div class="actions"><button id="saveSettings">SAVE SETTINGS</button><button id="resetSettings" class="secondary">RESTORE DEFAULTS</button></div></section>
</main></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const KSET='fm_single_settings_v1',KHIS='fm_single_history_v1';
const defaults={companyName:'FLEXILUBE',companyAddress:'',companyLogo:'',workInstruction:'PRO 02-03',frequency:'Annually',acceptableLimit:'<1% Difference',serials:['MC-01','H41989','H49493','P42320','P46701','J37903','P41704','J87906'],products:['450N','100N','P10','P12','SN100','SN600','HV1650','PROCESS120A'],defaultResponsible:'',decimals:2};
let settings=load(KSET,defaults),historyRecords=load(KHIS,[]),current=null,screen='main',drawing=false,signature='';
const $=id=>document.getElementById(id), val=id=>$(id).value.trim(), num=id=>Number($(id).value);
const storage=(()=>{try{const s=window.localStorage,p='fm_storage_probe';s.setItem(p,'1');s.removeItem(p);return s}catch{return{getItem:()=>null,setItem:()=>{}}}})();
const save=(k,v)=>storage.setItem(k,JSON.stringify(v));
function load(k,d){try{return Object.assign(Array.isArray(d)?[]:{},d,JSON.parse(storage.getItem(k)||JSON.stringify(d)))}catch{return structuredClone(d)}}
function today(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)}
function toast(m){$('toast').textContent=m;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function input(){return{date:val('date'),serial:val('serial'),product:val('product'),otherProduct:val('otherProduct'),tare:num('tare'),gross:num('gross'),litersPumped:num('litersPumped'),density:num('density'),responsible:val('responsible')}}
function validate(i){const e={};if(!i.date)e.date='Select a calibration date.';if(!i.serial)e.serial='Select a flowmeter serial number.';if(!i.product&&!i.otherProduct)e.product='Select a product or enter Other Product.';if(!isFinite(i.tare)||i.tare<0)e.tare='Tare weight cannot be negative.';if(!(i.gross>0))e.gross='Gross weight must be greater than zero.';else if(i.gross<=i.tare)e.gross='Gross weight must be greater than tare weight.';if(!(i.litersPumped>0))e.litersPumped='Liters pumped must be greater than zero.';if(!(i.density>0))e.density='Oil density must be greater than zero.';if(!i.responsible)e.responsible='Enter the responsible person.';return e}
function round(n){return Number(n.toFixed(settings.decimals))}function calculate(i){const mass=i.gross-i.tare,actual=mass/i.density,signed=(i.litersPumped-actual)/actual*100,abs=Math.abs(signed);return{...i,id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(36),createdAt:new Date().toISOString(),mass:round(mass),actualVolume:round(actual),percentageDifference:round(abs),signedMeterError:round(signed),result:abs<1?'IN SPEC':'OUT OF SPEC',signature:'',pdfSaved:false}}
function displayErrors(e){document.querySelectorAll('[data-e]').forEach(x=>x.textContent=e[x.dataset.e]||'')}
function saveRecord(r){const i=historyRecords.findIndex(x=>x.id===r.id);i>=0?historyRecords[i]=r:historyRecords.unshift(r);save(KHIS,historyRecords)}
function calibrate(){if($('calibrateBtn').disabled)return;$('calibrateBtn').disabled=true;setTimeout(()=>$('calibrateBtn').disabled=false,500);const i=input(),e=validate(i);displayErrors(e);if(Object.keys(e).length)return;current=calculate(i);saveRecord(current);renderResult();$('certificateBtn').disabled=false;toast('Calibration completed and saved locally.')}
function renderResult(){const ok=current.result==='IN SPEC';$('meterDisplay').setAttribute('fill',ok?'#20a447':'#d6252a');$('meterStatus').className='status '+(ok?'green':'red');$('meterStatus').textContent=`${current.result} • ${current.percentageDifference.toFixed(settings.decimals)}%`;$('resultPanel').classList.remove('hidden');$('resultPanel').innerHTML=`<b>Mass: ${current.mass.toFixed(settings.decimals)} kg</b><b>Actual volume: ${current.actualVolume.toFixed(settings.decimals)} L</b><b>Meter volume: ${current.litersPumped.toFixed(settings.decimals)} L</b><b>Signed error: ${current.signedMeterError>=0?'+':''}${current.signedMeterError.toFixed(settings.decimals)}%</b>`}
function reset(){if(current&&!current.pdfSaved&&!confirm('Clear this unprinted calibration?'))return;['serial','product','otherProduct','tare','gross','litersPumped','density'].forEach(id=>$(id).value='');$('date').value=today();$('responsible').value=settings.defaultResponsible;current=null;signature='';displayErrors({});$('meterDisplay').setAttribute('fill','white');$('meterStatus').className='status';$('meterStatus').textContent='READY';$('resultPanel').classList.add('hidden');$('certificateBtn').disabled=true}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function row(a,b){return `<div class="certrow"><b>${esc(a)}</b><span>${esc(b)}</span></div>`}
function renderCertificate(){if(!current)return;const other=current.otherProduct,product=other?'N/A':current.product,cls=current.result==='IN SPEC'?'green':'red';$('certificate').innerHTML=`${settings.companyLogo?`<img src="${settings.companyLogo}" style="max-height:55px;max-width:160px">`:''}<h2>${esc(settings.companyName)}</h2><div>${esc(settings.companyAddress)}</div><h3>FLOWMETER CALIBRATION TEST CERTIFICATE</h3>${row('Calibration Frequency',settings.frequency)}${row('Acceptable Limit',settings.acceptableLimit)}${row('Calibration of Flowmeter No',current.serial)}${row('According to Work Instruction',settings.workInstruction)}${row('Calibration Date',current.date)}${row('Tare Weight',current.tare.toFixed(settings.decimals)+' kg')}${row('Gross Weight',current.gross.toFixed(settings.decimals)+' kg')}${row('Mass of Oil',current.mass.toFixed(settings.decimals)+' kg')}${row('Oil Density',current.density.toFixed(settings.decimals)+' kg/L')}${row('Actual Calculated Volume',current.actualVolume.toFixed(settings.decimals)+' litres')}${row('Liters Pumped',current.litersPumped.toFixed(settings.decimals)+' litres')}${row('Product Used for Calibration',product)}${row('Other',other?other+' (manually entered)':'N/A')}${row('Percentage Difference',current.percentageDifference.toFixed(settings.decimals)+'%')}${row('Signed Meter Error',(current.signedMeterError>=0?'+':'')+current.signedMeterError.toFixed(settings.decimals)+'%')}<h3 class="${cls}">${current.result}</h3><p>${current.result==='IN SPEC'?'The flowmeter is within the acceptable limit and is IN SPEC.':'The flowmeter is outside the acceptable limit and is OUT OF SPEC.'}</p><p><b>Responsible Person:</b> ${esc(current.responsible)}</p><p><b>Signature:</b></p><canvas id="sig" class="signature" width="700" height="220"></canvas><button id="clearSig" class="secondary noPrint">CLEAR SIGNATURE</button><p><b>Date Stamp:</b> ${esc(current.date)}</p>`;setupSignature()}
function setupSignature(){const c=$('sig'),g=c.getContext('2d');if(current.signature){const im=new Image();im.onload=()=>g.drawImage(im,0,0);im.src=current.signature}function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{drawing=true;const p=pos(e);g.beginPath();g.moveTo(p.x,p.y);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drawing)return;const p=pos(e);g.lineWidth=4;g.lineCap='round';g.lineTo(p.x,p.y);g.stroke()};c.onpointerup=()=>{drawing=false;current.signature=c.toDataURL('image/png');saveRecord(current)};$('clearSig').onclick=()=>{g.clearRect(0,0,c.width,c.height);current.signature='';saveRecord(current)}}
function filename(ext='pdf'){return `Flowmeter_Calibration_${current.serial.replace(/[^a-z0-9_-]/gi,'_')}_${current.date}.${ext}`}
function certificateLines(){const p=current.otherProduct||current.product;return['FLOWMETER CALIBRATION TEST CERTIFICATE',settings.companyName,settings.companyAddress,'','Calibration Frequency: '+settings.frequency,'Acceptable Limit: '+settings.acceptableLimit,'Flowmeter No: '+current.serial,'Work Instruction: '+settings.workInstruction,'Calibration Date: '+current.date,'Tare Weight: '+current.tare.toFixed(settings.decimals)+' kg','Gross Weight: '+current.gross.toFixed(settings.decimals)+' kg','Mass of Oil: '+current.mass.toFixed(settings.decimals)+' kg','Oil Density: '+current.density.toFixed(settings.decimals)+' kg/L','Actual Calculated Volume: '+current.actualVolume.toFixed(settings.decimals)+' litres','Litres Pumped: '+current.litersPumped.toFixed(settings.decimals)+' litres','Product: '+p,'Percentage Difference: '+current.percentageDifference.toFixed(settings.decimals)+'%','Signed Meter Error: '+(current.signedMeterError>=0?'+':'')+current.signedMeterError.toFixed(settings.decimals)+'%','Result: '+current.result,'Responsible Person: '+current.responsible,current.signature?'Signed electronically':'Signature: not captured'];}
function pdfEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function pdfBlob(){const lines=certificateLines(),body=['BT','/F1 12 Tf','50 790 Td'];lines.forEach((x,i)=>{if(i)body.push('0 -20 Td');body.push('('+pdfEscape(x)+') Tj')});body.push('ET');const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 842] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>','<< /Length '+body.join('\n').length+' >>\nstream\n'+body.join('\n')+'\nendstream','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'];let pdf='%PDF-1.4\n',offsets=[0];objs.forEach((o,i)=>{offsets.push(pdf.length);pdf+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});const xref=pdf.length;pdf+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n ').join('\n')+'\ntrailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';return new Blob([pdf],{type:'application/pdf'})}
function downloadPdf(){if(!current)return;const u=URL.createObjectURL(pdfBlob()),a=document.createElement('a');a.href=u;a.download=filename();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);current.pdfSaved=true;saveRecord(current);toast('PDF download started.')}
function printCertificate(){if(!current)return;current.pdfSaved=true;saveRecord(current);try{window.print()}catch(e){toast('Printing is blocked in this preview. Use Save as PDF instead.')}}
async function shareCertificate(){if(!current)return;const blob=pdfBlob(),file=new File([blob],filename(),{type:'application/pdf'});try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:filename(),files:[file]});current.pdfSaved=true;saveRecord(current);return}}catch(e){if(e.name==='AbortError')return}downloadPdf();toast('Sharing is unavailable here, so the PDF download started.')}
function show(name){screen=name;document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));$(name+'Screen').classList.remove('hidden');$('title').textContent={main:'Flowmeter Calibration',certificate:'Certificate Preview',history:'Calibration History',settings:'Settings'}[name];$('backBtn').style.visibility=name==='main'?'hidden':'visible';if(name==='certificate')renderCertificate();if(name==='history')renderHistory();if(name==='settings')renderSettings()}
function renderLists(){$('serialList').innerHTML=settings.serials.map(x=>`<option value="${esc(x)}">`).join('');$('productList').innerHTML=settings.products.map(x=>`<option value="${esc(x)}">`).join('')}
function renderSettings(){['companyName','companyAddress','workInstruction','frequency','acceptableLimit','defaultResponsible','decimals'].forEach(k=>$(k).value=settings[k]);editList('serialEditor','serials');editList('productEditor','products')}
function editList(container,key){$(container).innerHTML=settings[key].map((x,i)=>`<div class="listrow"><input value="${esc(x)}" data-list="${key}" data-index="${i}"><button class="danger" data-del="${key}" data-index="${i}">×</button></div>`).join('')}
function saveSettingsForm(){['companyName','companyAddress','workInstruction','frequency','acceptableLimit','defaultResponsible'].forEach(k=>settings[k]=$(k).value.trim());settings.decimals=Math.min(4,Math.max(0,Number($('decimals').value)||2));document.querySelectorAll('[data-list]').forEach(x=>settings[x.dataset.list][Number(x.dataset.index)]=x.value.trim());settings.serials=settings.serials.filter(Boolean);settings.products=settings.products.filter(Boolean);save(KSET,settings);renderLists();toast('Settings saved locally.')}
function renderHistory(){const q=val('historySearch').toLowerCase(),d=val('historyDate'),res=val('historyResult');const list=historyRecords.filter(r=>(r.serial+' '+r.product+' '+r.otherProduct+' '+r.result).toLowerCase().includes(q)&&(!d||r.date===d)&&(!res||r.result===res));$('historyList').innerHTML=list.length?list.map(r=>`<article class="historyCard"><b>${esc(r.serial)} • ${esc(r.date)}</b><span class="${r.result==='IN SPEC'?'green':'red'}">${r.result} • ${r.percentageDifference}%</span><small>${esc(r.otherProduct||r.product)} • ${esc(r.responsible)}</small><div class="buttons"><button data-open="${r.id}">OPEN</button><button class="danger" data-delete="${r.id}">DELETE</button></div></article>`).join(''):'<p>No matching calibration records.</p>'}
function exportCsv(){const cols=['date','serial','product','otherProduct','tare','gross','mass','density','actualVolume','litersPumped','percentageDifference','signedMeterError','result','responsible'];const q=v=>'"'+String(v??'').replaceAll('"','""')+'"',csv=[cols.join(','),...historyRecords.map(r=>cols.map(c=>q(r[c])).join(','))].join('\r\n');download(new Blob([csv],{type:'text/csv'}),'Flowmeter_Calibration_History.csv')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('date').value=today();$('responsible').value=settings.defaultResponsible;renderLists();show('main');
$('calibrateBtn').onclick=calibrate;$('resetBtn').onclick=reset;$('certificateBtn').onclick=()=>show('certificate');$('printBtn').onclick=printCertificate;$('backBtn').onclick=()=>show('main');$('closeBtn').onclick=()=>screen==='main'?history.back():show('main');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
['historySearch','historyDate','historyResult'].forEach(id=>$(id).oninput=renderHistory);$('exportCsv').onclick=exportCsv;
$('historyList').onclick=e=>{const o=e.target.dataset.open,d=e.target.dataset.delete;if(o){current=historyRecords.find(x=>x.id===o);signature=current.signature||'';show('certificate')}if(d&&confirm('Delete this calibration record?')){historyRecords=historyRecords.filter(x=>x.id!==d);save(KHIS,historyRecords);renderHistory()}};
$('serialEditor').onclick=$('productEditor').onclick=e=>{if(e.target.dataset.del&&confirm('Delete this item?')){settings[e.target.dataset.del].splice(Number(e.target.dataset.index),1);renderSettings()}};$('addSerial').onclick=()=>{settings.serials.push('');renderSettings()};$('addProduct').onclick=()=>{settings.products.push('');renderSettings()};$('saveSettings').onclick=saveSettingsForm;$('resetSettings').onclick=()=>{if(confirm('Restore default settings and lists?')){settings=structuredClone(defaults);save(KSET,settings);renderSettings();renderLists()}};$('companyLogo').onchange=e=>{const f=e.target.files[0];if(f){const rd=new FileReader();rd.onload=()=>settings.companyLogo=rd.result;rd.readAsDataURL(f)}};
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('installAppBtn').textContent='INSTALL APP'});
$('installAppBtn').onclick=async()=>{if(installPrompt){installPrompt.prompt();const choice=await installPrompt.userChoice;installPrompt=null;toast(choice.outcome==='accepted'?'App installation started.':'Installation cancelled.');return}toast(location.protocol==='file:'?'For Android installation, use the PWA ZIP from a secure web server.':'Use your browser menu and select Install app or Add to Home screen.')};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
window.addEventListener('offline',()=>toast('Offline mode. All app data remains on this device.'));
</script></body></html>
